# Render Blueprint for the SLMS backend API.
#
# One-time setup (Render dashboard): New -> Blueprint -> connect this GitHub
# repo -> Render reads this file and provisions the service below, prompting
# only for the "sync: false" secrets. After that, every `git push` to main
# redeploys automatically — no CLI step needed, unlike Railway's `railway up`.

services:
  - type: web
    name: slms-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: SLMS API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_TIMEZONE
        value: Asia/Dhaka
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: 120
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: LIBRARY_LOAN_PERIOD_DAYS
        value: 14
      - key: LIBRARY_MAX_BOOKS_PER_STUDENT
        value: 3
      - key: LIBRARY_FINE_RATE_PER_DAY
        value: 5.00
      - key: LIBRARY_FINE_GRACE_DAYS
        value: 0
      - key: LIBRARY_FINE_MAX_CAP
        value: 500.00
      - key: LIBRARY_FINE_BLOCK_THRESHOLD
        value: 100.00
      - key: LIBRARY_MAX_RENEWALS
        value: 1
